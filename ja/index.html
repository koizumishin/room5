<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第5教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ja/style.css">
</head>
<body>

<!--
  新しい記事の追加方法（ビルド不要・手作業）:
  1. articles/_template.html をコピーして articles/002.html のような名前で保存
  2. コピーしたファイルの中身（ROOM番号・日付・タイトル・本文・視聴リンク）を書き換える
  3. このファイル（index.html）の <ul class="article-list"> の中に、
     下の <li class="article-item"> ブロックをコピーして1つ追加し、
     href・日付・ROOM番号・タイトルを新しい記事に合わせて書き換える
  4. git add / commit / push
-->

<main class="wrap">
  <h1>第5教室</h1>

  <ul class="article-list">
    <li class="article-item">
      <a href="/ja/articles/_template.html">
        <span class="a-date">［日付］</span><span class="a-room">［ROOM 001］</span>
        <span class="a-title">［まだ記事はありません。articles/_template.html を複製して最初の記事を追加してください］</span>
      </a>
    </li>
  </ul>

  <div class="subscribe">
    <p>新しい記事が出たら、知らせてほしい方は。</p>
    <!-- Buttondown（username: room5）の登録フォーム -->
    <form class="subscribe-form" action="https://buttondown.com/api/emails/embed-subscribe/room5" method="post" target="_blank">
      <input type="email" name="email" placeholder="メールアドレス" required>
      <button type="submit">登録</button>
    </form>
  </div>

  <p class="back"><a href="/">← room5.org</a></p>
</main>

</body>
</html>
