<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>room5</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    body{
      margin:0;
      background:#fff;
    }

    /* 文字は最小で、左が欠けない位置に */
    p{
      margin:16px 0 24px 16px;   /* 下に少し余白 */
      font-size:13px;
      color:#888;
    }

    /* 写真の縦の間＝呼吸 */
    .gallery{
      display:flex;
      flex-direction:column;
      gap:48px;                 /* ここが“間” */
      padding:0 0 48px 0;       /* 最後の余白 */
    }

    img{
      display:block;
      max-width:800px;
      width:100%;
      height:auto;
      margin:0 auto;
    }
  </style>
</head>
<body>

  <p>nothing is indexed here</p>

  <main class="gallery">
    <img src="assets/images/001.jpg" alt="">
    <img src="assets/images/002.jpg" alt="">
    <img src="assets/images/003.jpg" alt="">
    <img src="assets/images/004.jpg" alt="">
    <img src="assets/images/005.jpg" alt="">
  </main>

</body>
</html>
