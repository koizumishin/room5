<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>room5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .text {
      margin: 8px 0 0 8px;   /* 左上の“空気” */
      font-size: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #000;
      line-height: 1.2;
    }

    .image {
      margin: 16px 0 0 0;   /* 文字と写真の距離 */
    }

    .image img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="text">nothing is indexed here</div>

  <div class="image">
    <img src="assets/images/001.jpg" alt="">
  </div>
</body>
